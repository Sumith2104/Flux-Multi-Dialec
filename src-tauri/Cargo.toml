[package]
name = "fluxbase-desktop"
version = "0.1.0"
description = "Fluxbase Desktop Application"
authors = ["Sumith2104"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1" }

[dependencies]
tauri = { version = "1", features = [ "shell-open" ] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# it prevents compiling unnecessary libs and speeds up startup
custom-protocol = ["tauri/custom-protocol"]
