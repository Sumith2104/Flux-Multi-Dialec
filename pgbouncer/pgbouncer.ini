[databases]
# Connect to Fluxbase Postgres via PgBouncer
# fluxbase = host=your-rds-host port=5432 dbname=postgres
# Or use the environment variable
* = host=${DATABASE_HOST:-localhost} port=${DATABASE_PORT:-5432} dbname=${DATABASE_NAME:-postgres}

[pgbouncer]
# Pool mode: transaction (most efficient for serverless/HTTP workloads)
pool_mode = transaction

# Connection limits
max_client_conn = ${MAX_CLIENT_CONN:-1000}
default_pool_size = ${DEFAULT_POOL_SIZE:-20}
min_pool_size = ${MIN_POOL_SIZE:-2}
reserve_pool_size = ${RESERVE_POOL_SIZE:-5}
reserve_pool_timeout = ${RESERVE_POOL_TIMEOUT:-3}

# Timeouts
server_idle_timeout = ${SERVER_IDLE_TIMEOUT:-60}
server_lifetime = ${SERVER_LIFETIME:-3600}
server_connect_timeout = ${SERVER_CONNECT_TIMEOUT:-5}
server_reset_query = SET search_path TO pg_catalog

# Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

# Admin
admin_users = ${ADMIN_USERS:-}
stats_period = 60

# Listen address
listen_addr = 0.0.0.0
listen_port = ${LISTEN_PORT:-6432}

# Auth
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt