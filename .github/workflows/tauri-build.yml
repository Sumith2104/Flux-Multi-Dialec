name: Build Desktop Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-tauri:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          includeRelease: false

      - name: List Release Files (Debugging)
        run: |
          echo "=== Release Folder ==="
          dir src-tauri/target/release/ -ErrorAction SilentlyContinue
          echo "=== Bundle Folder ==="
          dir src-tauri/target/release/bundle/ -Depth 2 -ErrorAction SilentlyContinue
        shell: pwsh
        continue-on-error: true

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluxbase-desktop-installers
          path: |
            src-tauri/target/**/bundle/**/*.msi
            src-tauri/target/**/bundle/**/*.exe


